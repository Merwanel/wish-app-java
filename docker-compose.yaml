services:
  api-java:
    build:
      context: ./api-java
      # Multi-stage Maven build (default). For jar-only rebuilds see api-java/Dockerfile.local.
      dockerfile: Dockerfile
    container_name: api-java
    ports:
      - "3000:3000"
    networks:
      - my-net
    restart: on-failure:3
    stop_grace_period: 3s
    depends_on:
      redis-cache:
        condition: service_healthy
      prisma-postgres:
        condition: service_healthy
      image-scraper:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://prisma-postgres:5432/mydatabase
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=mypassword
      - SPRING_REDIS_HOST=redis-cache
      - SPRING_REDIS_PORT=6379
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - IMAGE_SCRAPER_URL=http://image-scraper:3001
    healthcheck:
      test: curl --fail --silent http://localhost:3000/status || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  
  image-scraper:
    build:
      context: .
      dockerfile: services/image-scraper/Dockerfile
    container_name: image-scraper
    ports:
      - "3001:3001"
    networks:
      - my-net
    restart: on-failure
    healthcheck:
      test: curl --fail --silent http://localhost:3001/health || exit 1
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      
  
  redis-cache:
    image: redis:8.2.2-alpine
    ports:
      - '6379:6379' 
    networks:
      - my-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      start_period: 5s 
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - my-net
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  prisma-postgres:
    image: postgres:17.5-alpine
    container_name: prisma-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    networks:
      - my-net
    restart: unless-stopped    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data 


  angular-app:
    build: 
      context: .
      dockerfile: angular-app/Dockerfile
    container_name: angular-app
    ports:
      - "8080:80"
    networks:
      - my-net
    restart: on-failure
    depends_on:
      api-java:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    

  success-message:
    image: alpine:3.22
    container_name: success-message
    networks:
      - my-net
    depends_on:
      api-java:
        condition: service_healthy
      prisma-postgres:
        condition: service_healthy
      angular-app:
        condition: service_healthy
    command: >
      sh -c "
      echo '🌐 Application is available at: http://localhost:8080' &&
      echo '📡 API server running on: http://localhost:3000' &&
      echo '🗄️ Database running on: localhost:5432' &&
      echo '🔴 Ctrl+C to stop the app'
      "
    restart: "no"


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
networks:
  my-net:
    driver: bridge