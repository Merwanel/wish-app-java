name: Docker Build and Push

on:
  workflow_call:
    inputs:
      service:
        description: "Image name suffix (api-java, angular-app, image-scraper)"
        required: true
        type: string
      context:
        description: "Docker build context path"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate CalVer
        id: version
        uses: ./.github/actions/calver

      - name: Validate docker compose
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: set_owner
        run: |
          val=${{ github.repository_owner }}
          echo "val=${val,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.set_owner.outputs.val }}/wish-app-java-${{ inputs.service }}:latest
            ghcr.io/${{ steps.set_owner.outputs.val }}/wish-app-java-${{ inputs.service }}:${{ steps.version.outputs.calver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/${{ steps.set_owner.outputs.val }}/wish-app-java-${{ inputs.service }}:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
