server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;
    client_max_body_size 50m;

    # Same-origin API: browser talks only to this nginx, which forwards to api-java.
    # SSE (/search/) needs buffering off and a long read timeout.
    location ~ ^/(status|all-wishes|wishes|new-wish|update-wish|convert-image|delete-wish|search|internal)(/|$) {
        proxy_pass http://api-java:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 65s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
